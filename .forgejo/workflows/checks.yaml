name: Check tools on ARM64
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ vars.RESONATOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native .NET 11 SDK
        uses: https://github.com/actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 11.0.x
      - name: Build tools that do not need game references
        run: |
          dotnet --info
          for tool in Resonator.ProjectBuilder Resonator.PatchGenerator Resonator.Deweaver; do
            dotnet build "src/$tool" -c Release
          done
      - name: Run source-only regression and release tests
        run: |
          dotnet run --project tests/Resonator.Remapping.Tests -c Release
          python3 -m unittest discover -s ci/tests -v
