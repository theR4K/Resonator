name: Validate current Resonite
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Optional Flatweave target (empty validates the full set)'
        default: ''
        type: string
      downloader:
        description: 'depotdownloader (native ARM64) or steamcmd'
        default: depotdownloader
        type: string

concurrency:
  group: resonator-resonite-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ vars.RESONATOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      RESONITE_DIR: ${{ forgejo.workspace }}/out/resonite
      RESONATOR_STEAM_HOME: ${{ vars.RESONATOR_STEAM_HOME }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native .NET 10 SDK
        uses: https://github.com/actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Download current Resonite from Steam
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAMCMD: ${{ vars.STEAMCMD }}
          DOWNLOADER: ${{ inputs.downloader || vars.RESONATOR_DOWNLOADER || 'depotdownloader' }}
        run: python3 ci/download_resonite.py "$RESONITE_DIR" --method "$DOWNLOADER"
      - name: Build and test tools against the downloaded install
        run: |
          dotnet build Resonator.slnx -c Release
          dotnet run --project tests/Resonator.Remapping.Tests -c Release --no-build
          python3 -m unittest discover -s ci/tests -v
      - name: Rebuild engine and check every patch
        env:
          TARGET: ${{ inputs.target }}
        run: python3 ci/validate_pipeline.py --resonite "$RESONITE_DIR" --target "$TARGET"
